name: Build iOS app (unsigned IPA)

# Runs on GitHub's Mac machines (you don't need a Mac). Produces an UNSIGNED .ipa.
# On Windows, install it on your iPhone with Sideloadly (it signs the app with your free Apple ID).
# Run it: GitHub → Actions → "Build iOS app" → Run workflow. Download the artifact when it is green.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true; xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Copy the web app into the iOS project and generate the Xcode project
        run: |
          cd ios
          bash build_ios.sh
          xcodebuild -list -project DeutschCoach.xcodeproj

      - name: Build (no code signing)
        run: |
          cd ios
          set -o pipefail
          xcodebuild \
            -project DeutschCoach.xcodeproj \
            -scheme DeutschCoach \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" \
            clean build | tee build.log | grep -E "error|warning: |BUILD" || true
          test -d build/Build/Products/Release-iphoneos/DeutschCoach.app || (tail -80 build.log; exit 1)

      - name: Package as .ipa
        run: |
          cd ios
          rm -rf Payload && mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DeutschCoach.app Payload/
          test -f Payload/DeutschCoach.app/www/index.html
          zip -qry DeutschCoach-unsigned.ipa Payload
          ls -la DeutschCoach-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DeutschCoach-unsigned-ipa
          path: ios/DeutschCoach-unsigned.ipa
          retention-days: 30
