name: Build iOS app (unsigned IPA)

# Runs on GitHub's macOS machines, which have Xcode installed.
# Produces an UNSIGNED .ipa that you sideload onto your iPhone with
# AltStore or Sideloadly (both re-sign it with your own free Apple ID).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Copy the web app into the iOS project and generate the Xcode project
        run: |
          cd ios
          ./build_ios.sh

      - name: Build (no code signing)
        run: |
          cd ios
          xcodebuild \
            -project DeutschCoach.xcodeproj \
            -scheme DeutschCoach \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package as .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DeutschCoach.app Payload/
          zip -qry DeutschCoach-unsigned.ipa Payload
          ls -la DeutschCoach-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DeutschCoach-unsigned-ipa
          path: ios/DeutschCoach-unsigned.ipa
          retention-days: 30
