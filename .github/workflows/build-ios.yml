name: Build iOS app (unsigned IPA)

# Runs on GitHub's Mac machines (you don't need a Mac). Produces an UNSIGNED .ipa.
# On Windows, install it on your iPhone with Sideloadly (it signs the app with your free Apple ID).
# Run it: GitHub → Actions → "Build iOS app" → Run workflow. Download the artifact when it is green.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # XcodeGen 2.43+ writes the Xcode 16 project format (objectVersion 77); Xcode 15 cannot open it
      # ("future Xcode project file format (77)"). So use the newest Xcode 16 on the runner.
      - name: Pick Xcode 16
        run: |
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
          ver=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$ver" -lt 16 ]; then echo "::error title=Xcode too old::This runner has Xcode $ver; Xcode 16 or newer is needed"; exit 1; fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Copy the web app into the iOS project and generate the Xcode project
        run: |
          cd ios
          bash build_ios.sh 2>&1 | tee gen.log
          if [ ! -d DeutschCoach.xcodeproj ]; then
            echo "::error title=XcodeGen failed::$(tail -5 gen.log | tr '\n' ' ')"
            exit 1
          fi
          xcodebuild -list -project DeutschCoach.xcodeproj

      - name: Build (no code signing)
        run: |
          cd ios
          set +e
          xcodebuild \
            -project DeutschCoach.xcodeproj \
            -scheme DeutschCoach \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" \
            clean build > build.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ] || [ ! -d build/Build/Products/Release-iphoneos/DeutschCoach.app ]; then
            # put the real compiler/linker errors into the run summary, so they show up as annotations
            grep -E "error:|fatal error|BUILD FAILED|Signing|requires a development team" build.log | sort -u | head -15 | while read -r line; do echo "::error title=Xcode::$line"; done
            echo "----- last 60 lines of the Xcode log -----"; tail -60 build.log
            exit 1
          fi
          grep -E "warning:" build.log | sort -u | head -5 || true
          echo "BUILD SUCCEEDED"

      - name: Upload the Xcode log (also when the build fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: ios/build.log
          if-no-files-found: ignore

      - name: Package as .ipa
        run: |
          cd ios
          rm -rf Payload && mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DeutschCoach.app Payload/
          test -f Payload/DeutschCoach.app/www/index.html
          zip -qry DeutschCoach-unsigned.ipa Payload
          ls -la DeutschCoach-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DeutschCoach-unsigned-ipa
          path: ios/DeutschCoach-unsigned.ipa
          retention-days: 30
